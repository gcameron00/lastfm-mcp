name = "lastfm-mcp"
main = "src/index-oauth.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "MCP_RL"
id = "9cb8fade1e11421398e5b4d49d033e29"

[[kv_namespaces]]
binding = "MCP_SESSIONS"
id = "ec6391f5cf10492c937eea63d6f8d9e4"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "7a93c832e6384971805f7f29f34f18c6"

# Secrets (set in the Cloudflare dashboard under Workers & Pages -> lastfm-mcp -> Settings -> Variables and Secrets):
# - LASTFM_API_KEY
# - LASTFM_SHARED_SECRET